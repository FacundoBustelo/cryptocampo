name: Validar contratos

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  contratos:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obtener el proyecto
        uses: actions/checkout@v6

      - name: Preparar el entorno con versiones fijadas
        id: setup
        run: bash tools/setup.sh

      - name: Registrar el commit y las revisiones de bibliotecas
        run: |
          git rev-parse HEAD
          git -C lib/openzeppelin-contracts rev-parse HEAD
          git -C lib/forge-std rev-parse HEAD

      - name: Compilar
        id: build
        run: .tools/bin/forge build

      - name: Comprobar el formato
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .tools/bin/forge fmt --check

      - name: Ejecutar las pruebas
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: .tools/bin/forge test -vv

      - name: Medir la cobertura
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          coverage_log="$RUNNER_TEMP/cryptocampo-coverage.txt"
          if .tools/bin/forge coverage --report summary --report debug --color never > "$coverage_log" 2>&1; then
            python3 tools/summarize-coverage.py "$coverage_log"
          else
            cat "$coverage_log"
            exit 1
          fi

      - name: Informar el consumo de gas
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: .tools/bin/forge test --gas-report

      - name: Medir gas por tamaño de lista y lote
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          .tools/bin/forge build --force
          python3 tools/measure-gas.py
