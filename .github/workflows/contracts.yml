name: Validar contratos

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  contratos:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obtener el proyecto
        uses: actions/checkout@v6

      - name: Preparar el entorno con versiones fijadas
        run: |
          mkdir -p .tools/validation
          set -o pipefail
          bash tools/setup.sh 2>&1 | tee .tools/validation/setup.txt

      - name: Validar y conservar informes de pruebas, cobertura y gas
        if: ${{ !cancelled() }}
        run: python3 tools/validate-system.py --output-dir .tools/validation/ci

      - name: Conservar evidencia incluso ante fallos
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: contracts-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tools/validation/
          include-hidden-files: true
          if-no-files-found: warn
