name: Verificar publicación IPFS y URI en Anvil

on:
  workflow_dispatch:
    inputs:
      independent_gateway:
        description: Gateway independiente a comprobar
        required: true
        default: ipfs.io
        type: choice
        options:
          - ipfs.io
          - filebase

permissions:
  contents: read

jobs:
  metadatos:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obtener el proyecto
        uses: actions/checkout@v6

      - name: Preparar el entorno con versiones fijadas
        run: bash tools/setup.sh

      - name: Verificar publicación y resolución
        env:
          INDEPENDENT_GATEWAY: ${{ inputs.independent_gateway }}
        run: python3 tools/verify-metadata.py --independent-gateway "$INDEPENDENT_GATEWAY"

      - name: Conservar evidencia incluso si falla la verificación
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: metadata-verification-${{ github.run_id }}
          path: .tools/metadata-verification/
          include-hidden-files: true
          if-no-files-found: warn
